name: 검사와 GitHub Pages 배포

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 검사와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - name: 보안 규칙과 Firestore 저장소 테스트(에뮬레이터)
        run: npx -y firebase-tools@15 emulators:exec --only auth,firestore --project demo-songjeong "npx vitest run --config vitest.rules.config.ts"
      - name: 빌드
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: 새로고침 대비 404 페이지 만들기
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Pages 배포
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
